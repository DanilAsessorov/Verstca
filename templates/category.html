<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .catalog-section {
            padding: 60px 0;
        }
        .category-card {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            border-radius: 10px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            transition: transform 0.3s;
        }
        .category-card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Магазин</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/catalog">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/category">Категория</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contacts">Контакты</a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person"></i> Пользователь
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right"></i> Выход</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="catalog-section">
        <div class="container">
            <h1 class="text-center mb-5">Каталог товаров</h1>

            <div class="row">
                <div class="col-md-4">
                    <div class="category-card" style="background: linear-gradient(45deg, #667eea, #764ba2);">
                        Электроника
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="category-card" style="background: linear-gradient(45deg, #f093fb, #f5576c);">
                        Книги
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="category-card" style="background: linear-gradient(45deg, #4facfe, #00f2fe);">
                        Одежда
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="category-card" style="background: linear-gradient(45deg, #43e97b, #38f9d7);">
                        Спорт
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="category-card" style="background: linear-gradient(45deg, #fa709a, #fee140);">
                        Красота
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="category-card" style="background: linear-gradient(45deg, #a8edea, #fed6e3); color: #333;">
                        Дом и сад
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Футер -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="mb-0">&copy; 2023 Магазин</p>
                </div>
                <div class="col-md-6 text-end">
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            Пользователь
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right"></i> Выход</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
